name: DevSecOps Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  trivy-scan-and-ingest:
    name: Trivy Vulnerability Scan & Ingestion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet dependencies (generates project.assets.json for Trivy)
        run: dotnet restore DevSecOpsSaaS/DevSecOpsSaaS.csproj

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Run Trivy filesystem vulnerability scan
        run: |
          trivy fs --scanners vuln --format json --output trivy-report.json --exit-code 0 .

      - name: Normalize Trivy JSON & Push to DevSecOpsSaaS API
        env:
          DEVSECOPS_API_URL: ${{ secrets.DEVSECOPS_API_URL }}
          DEVSECOPS_API_KEY: ${{ secrets.DEVSECOPS_API_KEY }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import urllib.request
          import urllib.error

          severity_map = {
              "CRITICAL": "Critique",
              "HIGH": "Haute",
              "MEDIUM": "Moyenne",
              "LOW": "Faible",
              "UNKNOWN": "Faible"
          }

          with open("trivy-report.json", "r", encoding="utf-8") as f:
              trivy_data = json.load(f)

          vulnerabilities = []
          for result in trivy_data.get("Results", []):
              target = (result.get("Target") or "")[:500]
              for v in result.get("Vulnerabilities") or []:
                  cvss_score = 5.0
                  cvss_block = v.get("CVSS") or {}
                  for source_data in cvss_block.values():
                      if isinstance(source_data, dict) and source_data.get("V3Score") is not None:
                          cvss_score = max(0.0, min(10.0, float(source_data["V3Score"])))
                          break

                  cve_id = (v.get("VulnerabilityID") or "UNKNOWN")[:100]
                  pkg_name = v.get("PkgName") or "unknown"
                  installed_ver = v.get("InstalledVersion") or "unknown"
                  package_str = f"{pkg_name}@{installed_ver}"[:250]
                  raw_title = v.get("Title") or f"{cve_id} in {pkg_name}"
                  raw_desc = v.get("Description") or f"Detected by Trivy in {target}"
                  fixed_ver = v.get("FixedVersion")
                  recommandation = f"Mettre a jour {pkg_name} vers {fixed_ver}" if fixed_ver else None

                  sev = (v.get("Severity") or "MEDIUM").upper()
                  vulnerabilities.append({
                      "cveId": cve_id,
                      "titre": raw_title[:250],
                      "description": raw_desc,
                      "fichier": target if target else None,
                      "package": package_str,
                      "recommandation": recommandation,
                      "scoreBrut": cvss_score,
                      "gravite": severity_map.get(sev, "Moyenne")
                  })

          payload = {
              "outil": "Trivy",
              "commitSha": os.environ["COMMIT_SHA"][:8],
              "branche": os.environ["BRANCH_NAME"][:150],
              "numeroBuild": f"gh-{os.environ['BUILD_NUMBER']}"[:100],
              "vulnerabilites": vulnerabilities
          }

          api_url = os.environ["DEVSECOPS_API_URL"].rstrip("/") + "/api/rapports"
          req = urllib.request.Request(
              api_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['DEVSECOPS_API_KEY']}",
                  "Content-Type": "application/json",
                  "User-Agent": "DevSecOpsSaaS-GitHubActions/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f"Ingestion succeeded ({resp.status}): {len(vulnerabilities)} findings sent.")
                  print(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"Ingestion failed ({e.code}): {e.read().decode('utf-8')}")
              raise
          EOF